services:
  proyecto_bases_mysql_db:
    image: mysql:8.0
    container_name: proyecto_bases_mysql_db
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3506:3306"   # opcional: para conectarte desde tu host
    volumes:
      - proyecto_bases_mysql_data:/var/lib/mysql
      - ./sql_nuevo.sql:/docker-entrypoint-initdb.d/init.sql:ro
    tmpfs:
      - /var/run/mysqld 
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - backend
    restart: unless-stopped

  proyecto_bases_web:
    build: .
    container_name: proyecto_bases_web
    env_file:
      - .env            # aquí debe vivir DB_HOST=proyecto_bases_mysql_db
    environment:
      FLASK_APP: app.py
      FLASK_DEBUG: "1"
      FLASK_ENV: development
      PYTHONUNBUFFERED: "1"
      SEED_DATABASE: "true"  # Set to "false" to skip auto-seeding
    command: flask run --host=0.0.0.0 --port=5000
    ports:
      - "5002:5000"
    depends_on:
      proyecto_bases_mysql_db:
        condition: service_healthy
    volumes:
      - .:/app          # <-- monta tu código: recarga al guardar
    networks:
      - backend
    restart: unless-stopped

volumes:
  proyecto_bases_mysql_data:

networks:
  backend:
