[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
markers =
    unit: Pruebas unitarias aisladas sin dependencias externas
    integration: Pruebas con interacción de base de datos MySQL
    edge: Pruebas de casos borde, fallos de seguridad y límites
    perf: Pruebas de rendimiento, SLAs y concurrencia
    slow: Pruebas que requieren múltiples conexiones o tiempo prolongado
